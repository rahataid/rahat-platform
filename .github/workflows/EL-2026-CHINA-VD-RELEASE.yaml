name: EL China Release 2026 CI/CD
on:
  workflow_dispatch:

env:
  CI: false

jobs:
  rahat-platform:
    name: rahat-platform
    runs-on: ubuntu-latest
    if: startsWith(github.ref_name, 'release/') && github.event_name == 'workflow_dispatch'
    env:
      # job-level so the Sentry step's `if` can see it
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          # full history so Sentry can match commits to the release
          fetch-depth: 0

      - uses: actions/setup-node@v3
        with:
          node-version: 20.10.0

      - name: Install pnpm
        run: |
          npm install -g pnpm@9.15.2
          pnpm install
          npx nx reset
          pnpm prisma:generate
          pnpm build:all

      # Stamp a debug ID into each built file and its source map so Sentry can
      # match them up later. Must run before the Docker image copies dist/.
      - name: Inject Sentry debug IDs into build
        run: npx --yes @sentry/cli@2 sourcemaps inject dist/apps/rahat

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from package.json
        id: extract_version
        run: echo "VERSION=$(jq -r '.version' package.json)" >> $GITHUB_ENV

      - name: Extract Timestamp
        id: extract-timestamp
        run: |
          TIMESTAMP=$(date "+%Y-%m-%d_%H-%M-%S")
          echo "timestamp=$TIMESTAMP" >> $GITHUB_ENV

      # Beneficiary Image
      - name: build && push beneficiary
        id: build-push-beneficiary
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.beneficiary
          push: ${{ github.event_name == 'workflow_dispatch' }}
          tags: |
            esatya/rahat-platform-beneficiary:el-release-china-vd-2026
            esatya/rahat-platform-beneficiary:el-release-china-vd-2026-${{ env.VERSION }}
            esatya/rahat-platform-beneficiary:el-release-china-vd-20266-${{ env.VERSION }}-${{ env.timestamp }}

      # Rahat Image
      - name: build && push rahat
        id: build-push-rahat
        uses: docker/build-push-action@v3
        with:
          context: .
          file: Dockerfile.rahat
          push: ${{ github.event_name == 'workflow_dispatch' }}
          build-args: |
            SENTRY_RELEASE=${{ github.sha }}
          tags: |
            esatya/rahat-platform-rahat:el-release-china-vd-2026
            esatya/rahat-platform-rahat:el-release-china-vd-2026-${{ env.VERSION }}
            esatya/rahat-platform-rahat:el-release-china-vd-2026-${{ env.VERSION }}-${{ env.timestamp }}

      # Tell Sentry a new version shipped: creates the release, attaches the
      # commits (for suspect commits) and marks the deploy. Skipped when the
      # Sentry secrets aren't configured so it never blocks a release.
      - name: Create Sentry release and mark deploy
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v3
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          release: ${{ github.sha }}

      # Upload source maps so Sentry shows original TypeScript stack traces.
      - name: Upload source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        run: npx --yes @sentry/cli@2 sourcemaps upload --release=${{ github.sha }} dist/apps/rahat
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

# if needed tag- :el-2026-release-
